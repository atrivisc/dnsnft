# domain            [ipv4-set  [ipv6-set]]
#
# 'example.com' matches that name only, '*.example.com' also matches every
# name under it. A '*' inside a label matches any characters in that label
# only: 'ex*.example.com' matches 'ex1.example.com' but not
# 'a.ex1.example.com'; '*.ex*.example.com' matches both. Without a set, the ones given with -4 and -6 are used; '-'
# leaves that family out.
